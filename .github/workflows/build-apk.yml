name: Build appRoc APK

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure gradlew has LF line endings and is executable
        run: |
          dos2unix gradlew
          chmod +x gradlew

      - name: Build release APK (signed with debug keystore)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appRoc-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
